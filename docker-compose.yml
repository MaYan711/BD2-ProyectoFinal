services:
  mongodb:
    image: mongo:7
    container_name: bd2_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bd2_proyecto_final
    volumes:
      - mongodb_data:/data/db

  neo4j:
    image: neo4j:5
    container_name: bd2_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/bd2proyecto2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs: